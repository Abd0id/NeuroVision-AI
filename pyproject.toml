[project]
name = "neurovision-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abd0id", email = "abdellah.idfath.dev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "imutils>=0.5.4",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.0",
    "tensorflow>=2.21.0",
]

[project.scripts]
neurovision-ai = "neurovision_ai:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
